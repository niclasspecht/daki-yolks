# Shared build used by every image workflow (base/* and custom/*).
# Builds one multi-arch image per version from <path>/Dockerfile, smoke-tests it the
# way Wings runs it (non-root user + STARTUP, with <path>/test as the server files)
# and pushes it to ghcr.io/<owner>/<repo>:<family>_<version>.
# Without rebuild, a version is only built when its base image has changed.
# A built image is only pushed when its base image, installed packages or build files
# differ from the published one, so nodes do not download identical images again.
name: build (shared)

on:
  workflow_call:
    inputs:
      family:
        description: "Tag prefix, e.g. nodejs"
        type: string
        required: true
      path:
        description: "Image folder with Dockerfile and test/, e.g. base/nodejs"
        type: string
        required: true
      versions:
        description: 'JSON list, e.g. ["22","24"]'
        type: string
        required: true
      base:
        description: "Full base image reference, %s = version"
        type: string
        required: true
      build_arg:
        description: "Name of the version build arg"
        type: string
        required: true
      test_startup:
        description: "STARTUP command for the smoke test"
        type: string
        required: true
      test_expect:
        description: "Expected smoke test output, %s = version"
        type: string
        required: true
      inventory:
        description: "Command that lists language packages, added to the dpkg list for the fingerprint"
        type: string
        required: true
      rebuild:
        description: "Build and test even if the base image is unchanged"
        type: boolean
        default: true
      force:
        description: "Push even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: "${{ inputs.family }}_${{ matrix.version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
    env:
      TAG: "${{ inputs.family }}_${{ matrix.version }}"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check base image
        id: check
        env:
          BASE_TEMPLATE: ${{ inputs.base }}
          VERSION: ${{ matrix.version }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          base=$(printf "$BASE_TEMPLATE" "$VERSION")
          for attempt in 1 2 3 4 5; do
            digest=$( (docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' || true) | jq -r '.digest // empty' 2>/dev/null || true)
            [[ "$digest" == sha256:* ]] && break
            echo "Could not read digest of $base (attempt $attempt), retrying ..."
            sleep $((attempt * 10))
          done
          [[ "$digest" == sha256:* ]] || { echo "::error::Could not read digest of $base"; exit 1; }
          published=$(docker buildx imagetools inspect "$image:$TAG" --format '{{json .Image}}' 2>/dev/null || true)
          label() { jq -r --arg k "$1" '[.. | objects | .Labels? // empty | .[$k] // empty][0] // ""' <<< "$published" 2>/dev/null || true; }
          current=$(label org.opencontainers.image.base.digest)
          fingerprint=$(label cc.daki.yolks.fingerprint)

          echo "Base:     $base"
          echo "Upstream: $digest"
          echo "Built on: ${current:-<none>}"

          if [ "$digest" != "$current" ]; then
            base_changed=true; build=true
          elif [ "$REBUILD" = "true" ]; then
            base_changed=false; build=true
          else
            base_changed=false; build=false
            echo "::notice title=$TAG::base image unchanged, nothing to do"
          fi

          {
            echo "image=$image"
            echo "base=$base"
            echo "digest=$digest"
            echo "build=$build"
            echo "base_changed=$base_changed"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4

      - if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Test build (amd64)
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.path }}
          build-args: ${{ inputs.build_arg }}=${{ matrix.version }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          provenance: false
          load: true
          tags: smoke-test:${{ env.TAG }}

      - name: Smoke test like Wings
        if: steps.check.outputs.build == 'true'
        env:
          STARTUP_CMD: ${{ inputs.test_startup }}
          EXPECT_TEMPLATE: ${{ inputs.test_expect }}
          VERSION: ${{ matrix.version }}
        run: |
          expect=$(printf "$EXPECT_TEMPLATE" "$VERSION")
          home="$RUNNER_TEMP/home-$TAG"; mkdir -p "$home"
          cp -r "${{ inputs.path }}/test/." "$home/"
          chmod -R a+rwX "$home"
          rc=0
          out=$(docker run --rm --user 988:988 -v "$home:/home/container" -e STARTUP="$STARTUP_CMD" "smoke-test:$TAG" 2>&1) || rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] || { echo "::error::Smoke test exited with code $rc"; exit 1; }
          for want in "$expect" "smoke ok"; do
            grep -qF "$want" <<< "$out" || { echo "::error::Expected '$want' in the output"; exit 1; }
          done

      - name: Compare with published image
        id: compare
        if: steps.check.outputs.build == 'true'
        env:
          INVENTORY: ${{ inputs.inventory }}
          FORCE: ${{ inputs.force }}
          BASE_CHANGED: ${{ steps.check.outputs.base_changed }}
          PUBLISHED: ${{ steps.check.outputs.fingerprint }}
        run: |
          inventory="$RUNNER_TEMP/inventory-$TAG.txt"
          {
            (cd "${{ inputs.path }}" && find . -type f ! -path './test/*' ! -name '*.md' ! -name 'egg-*.json' -print0 | sort -z | xargs -0 sha256sum)
            docker run --rm -e INVENTORY="$INVENTORY" --entrypoint sh "smoke-test:$TAG" \
              -c 'dpkg-query -W -f="\${Package} \${Version} \${Architecture}\n" && eval "$INVENTORY"'
          } > "$inventory"
          fingerprint=sha256:$(sha256sum "$inventory" | cut -d' ' -f1)
          echo "::group::Build files and packages ($(wc -l < "$inventory") lines)"
          cat "$inventory"
          echo "::endgroup::"
          echo "Fingerprint: $fingerprint"
          echo "Published:   ${PUBLISHED:-<none>}"

          if [ "$FORCE" = "true" ]; then
            push=true; msg="forced push"
          elif [ "$BASE_CHANGED" = "true" ]; then
            push=true; msg="base image changed, pushing"
          elif [ "$fingerprint" != "$PUBLISHED" ]; then
            push=true; msg="packages or build files changed, pushing"
          else
            push=false; msg="no changes, keeping the published image"
          fi
          echo "::notice title=$TAG::$msg"
          { echo "push=$push"; echo "fingerprint=$fingerprint"; } >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        if: steps.compare.outputs.push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.path }}
          build-args: ${{ inputs.build_arg }}=${{ matrix.version }}
          platforms: linux/amd64,linux/arm64
          pull: true
          provenance: false
          push: true
          tags: ${{ steps.check.outputs.image }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=${{ steps.check.outputs.base }}
            org.opencontainers.image.base.digest=${{ steps.check.outputs.digest }}
            cc.daki.yolks.fingerprint=${{ steps.compare.outputs.fingerprint }}
