name: build custom nodejs-playwright

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild all versions, even if the base image is unchanged"
        type: boolean
        default: true
  # Built on top of the Daki Node.js images: rebuild right after they were pushed.
  # Without force, only versions whose nodejs_<v> image actually changed are rebuilt.
  # The Monday full rebuild of the Node.js images therefore rebuilds these too.
  workflow_run:
    workflows: ["build nodejs"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "custom/nodejs-playwright/**"
      - ".github/workflows/custom-nodejs-playwright.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nodejs-playwright:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/build.yml
    with:
      family: nodejs-playwright
      path: custom/nodejs-playwright
      versions: '["22", "24", "26"]'
      base: "ghcr.io/niclasspecht/daki-yolks:nodejs_%s"
      build_arg: NODE_VERSION
      test_startup: "npm install --no-save --no-audit --no-fund playwright && node node_modules/playwright-core/cli.js install chromium firefox && xvfb-run -a -s \"-screen 0 1920x1080x24\" node smoke.mjs"
      test_expect: "Node.js Version: v%s."
      force: ${{ github.event_name == 'push' || inputs.force == true }}
