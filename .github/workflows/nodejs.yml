name: build nodejs

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild all versions, even if the base image is unchanged"
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * 1"   # Monday: always rebuild (Debian package updates)
    - cron: "47 */6 * * *" # every 6 h: rebuild if node:<v>-trixie-slim changed
  push:
    branches: [main]
    paths:
      - "nodejs/**"
      - "tests/nodejs/**"
      - ".github/workflows/nodejs.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nodejs:
    uses: ./.github/workflows/build.yml
    with:
      family: nodejs
      versions: '["22", "24", "26"]'
      base: "node:%s-trixie-slim"
      build_arg: NODE_VERSION
      test_startup: "npm -v && tsc -v && ts-node smoke.ts"
      test_expect: "Node.js Version: v%s."
      force: ${{ github.event_name == 'push' || inputs.force == true || github.event.schedule == '17 3 * * 1' }}
