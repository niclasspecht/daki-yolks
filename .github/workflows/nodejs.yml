name: build nodejs

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Push all versions, even if nothing changed"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"   # Monday: rebuild, push if packages changed
    - cron: "47 */6 * * *" # every 6 h: rebuild if node:<v>-trixie-slim changed
  push:
    branches: [main]
    paths:
      - "base/nodejs/**"
      - ".github/workflows/nodejs.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nodejs:
    uses: ./.github/workflows/build.yml
    with:
      family: nodejs
      path: base/nodejs
      versions: '["22", "24", "26"]'
      base: "docker.io/library/node:%s-trixie-slim"
      build_arg: NODE_VERSION
      test_startup: "npm -v && tsc -v && ts-node smoke.ts"
      test_expect: "Node.js Version: v%s."
      inventory: "node -v && npm ls --global --all"
      rebuild: ${{ github.event_name != 'schedule' || github.event.schedule == '17 3 * * 1' }}
      force: ${{ inputs.force == true }}
