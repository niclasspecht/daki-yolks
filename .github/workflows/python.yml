name: build python

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Push all versions, even if nothing changed"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"   # Monday: rebuild, push if packages changed
    - cron: "47 */6 * * *" # every 6 h: rebuild if python:<v>-slim-trixie changed
  push:
    branches: [main]
    paths:
      - "base/python/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  python:
    uses: ./.github/workflows/build.yml
    with:
      family: python
      path: base/python
      versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      base: "docker.io/library/python:%s-slim-trixie"
      build_arg: PYTHON_VERSION
      test_startup: "pip --version && python smoke.py"
      test_expect: "Python %s."
      inventory: "python --version && python -m pip list --format=freeze"
      rebuild: ${{ github.event_name != 'schedule' || github.event.schedule == '17 3 * * 1' }}
      force: ${{ inputs.force == true }}
