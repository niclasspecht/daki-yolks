name: build python

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild all versions, even if the base image is unchanged"
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * 1"   # Monday: always rebuild (Debian package updates)
    - cron: "47 */6 * * *" # every 6 h: rebuild if python:<v>-slim-trixie changed
  push:
    branches: [main]
    paths:
      - "python/**"
      - "tests/python/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  python:
    uses: ./.github/workflows/build.yml
    with:
      family: python
      versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      base: "python:%s-slim-trixie"
      build_arg: PYTHON_VERSION
      test_startup: "pip --version && python smoke.py"
      test_expect: "Python %s."
      force: ${{ github.event_name == 'push' || inputs.force == true || github.event.schedule == '17 3 * * 1' }}
